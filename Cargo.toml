[package]
name = "stellar-scenario"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Local-first toolkit for defining, validating, and executing reproducible Stellar/Soroban test scenarios."
license = "MIT"
repository = "https://github.com/butiploka/stellar-scenario-kit"
readme = "README.md"
keywords = ["stellar", "soroban", "blockchain", "testing", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Megumi <butiploka@users.noreply.github.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
