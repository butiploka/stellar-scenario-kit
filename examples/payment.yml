schema_version: "1.0"
name: payment_alice_to_bob
description: Send 100 XLM from alice to bob on testnet, then assert bob's balance.
network: testnet
source: alice
steps:
  - action: ensure_funded
    identity: alice
    min_balance: 200

  - action: payment
    from: alice
    to: bob
    amount: "100"
    asset: native

  - action: assert_balance
    identity: bob
    min_balance: 100
